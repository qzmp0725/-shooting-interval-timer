<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Shooting Timer" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>60분 사격 인터벌 타이머</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;background:#0b0b0c;color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}
body{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))
}
main{width:min(560px,100%);text-align:center}
.eyebrow{font-size:14px;color:#8e8e93;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.time{
  font-size:clamp(72px,22vw,120px);font-weight:750;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.055em;margin:12px 0 18px
}
.cue{font-size:30px;font-weight:750;min-height:42px;margin-bottom:8px}
.status{font-size:15px;color:#8e8e93;min-height:22px;margin-bottom:28px;line-height:1.4}
.progress{height:7px;background:#232326;border-radius:999px;overflow:hidden;margin-bottom:28px}
.bar{height:100%;width:0%;background:#f5f5f7}
.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
button{
  appearance:none;border:none;border-radius:16px;padding:17px 12px;
  font-size:17px;font-weight:700;background:#202024;color:#fff
}
button.primary{background:#f5f5f7;color:#0b0b0c}
button:disabled{opacity:.4}
.note{font-size:13px;color:#66666b;line-height:1.55;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">10m Air Pistol · 60 min</div>
  <div id="time" class="time">00:00</div>
  <div id="cue" class="cue">Ready</div>
  <div id="status" class="status">오디오 준비 중…</div>

  <div class="progress"><div id="bar" class="bar"></div></div>

  <div class="controls">
    <button id="start" class="primary">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>

  <div class="note">
    음성 규칙: 01:00 Start → 02:00 Unload → 02:55 Attention → 03:00 Start 반복.<br>
    60:00에는 Stop 후 종료.
  </div>
</main>

<!-- GitHub 저장소의 실제 파일 위치와 일치하도록 루트 경로 사용 -->
<audio id="track"
       preload="metadata"
       playsinline
       webkit-playsinline
       src="./interval_60min.mp3?v=2"></audio>

<script>
const audio = document.getElementById('track');
const timeEl = document.getElementById('time');
const cueEl = document.getElementById('cue');
const statusEl = document.getElementById('status');
const barEl = document.getElementById('bar');
const startBtn = document.getElementById('start');
const pauseBtn = document.getElementById('pause');
const resetBtn = document.getElementById('reset');

const TOTAL = 3600;
let raf = null;
let wakeLock = null;
let lastCueSecond = -1;

function fmt(sec) {
  sec = Math.max(0, Math.min(TOTAL, Math.floor(sec)));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function cueAt(sec) {
  const s = Math.floor(sec);
  if (s >= TOTAL) return 'Stop';
  if (s >= 60 && s % 120 === 60) return 'Start';
  if (s >= 120 && s % 120 === 0) return 'Unload';
  if (s >= 175 && s % 120 === 55) return 'Attention';
  return '';
}

function render() {
  const t = Math.min(Number.isFinite(audio.currentTime) ? audio.currentTime : 0, TOTAL);
  const whole = Math.floor(t);

  timeEl.textContent = fmt(t);
  barEl.style.width = `${(t / TOTAL) * 100}%`;

  const cue = cueAt(t);
  if (cue && whole !== lastCueSecond) {
    cueEl.textContent = cue;
    lastCueSecond = whole;
  } else if (!cue && !audio.paused && whole !== lastCueSecond) {
    cueEl.textContent = '';
  }

  if (!audio.paused && !audio.ended) {
    raf = requestAnimationFrame(render);
  }
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) {}
}

function releaseWakeLock() {
  if (wakeLock) {
    try { wakeLock.release(); } catch (_) {}
    wakeLock = null;
  }
}

audio.addEventListener('loadedmetadata', () => {
  if (audio.paused && audio.currentTime === 0) {
    statusEl.textContent = '준비 완료 · Start를 눌러주세요';
  }
});

audio.addEventListener('canplay', () => {
  if (audio.paused && audio.currentTime === 0) {
    statusEl.textContent = '준비 완료 · Start를 눌러주세요';
  }
});

audio.addEventListener('error', () => {
  const code = audio.error ? audio.error.code : '?';
  statusEl.textContent = `오디오를 불러오지 못했어요 (오류 ${code}). Safari에서 새로고침해 주세요.`;
});

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  statusEl.textContent = '재생을 시작하는 중…';

  try {
    // iOS Safari: 사용자가 직접 누른 이벤트 안에서 play() 호출
    const playPromise = audio.play();
    if (playPromise !== undefined) await playPromise;

    statusEl.textContent = '진행 중';
    startBtn.textContent = 'Resume';
    await requestWakeLock();

    cancelAnimationFrame(raf);
    render();
  } catch (e) {
    console.error('Audio play failed:', e);
    const name = e && e.name ? e.name : '재생 오류';

    if (name === 'NotAllowedError') {
      statusEl.textContent = 'Safari가 오디오 재생을 차단했어요. 음량을 올리고 Start를 다시 눌러주세요.';
    } else if (name === 'NotSupportedError') {
      statusEl.textContent = '오디오 파일을 찾거나 재생할 수 없어요. 페이지를 새로고침해 주세요.';
    } else {
      statusEl.textContent = `재생 실패: ${name}`;
    }
  } finally {
    startBtn.disabled = false;
  }
});

pauseBtn.addEventListener('click', () => {
  audio.pause();
  statusEl.textContent = '일시정지';
  cancelAnimationFrame(raf);
  releaseWakeLock();
});

resetBtn.addEventListener('click', () => {
  audio.pause();

  try { audio.currentTime = 0; } catch (_) {}

  cancelAnimationFrame(raf);
  releaseWakeLock();

  lastCueSecond = -1;
  timeEl.textContent = '00:00';
  cueEl.textContent = 'Ready';
  barEl.style.width = '0%';
  startBtn.textContent = 'Start';
  statusEl.textContent = audio.readyState >= 1
    ? '준비 완료 · Start를 눌러주세요'
    : '오디오 준비 중…';
});

audio.addEventListener('play', () => {
  statusEl.textContent = '진행 중';
  cancelAnimationFrame(raf);
  render();
});

audio.addEventListener('timeupdate', render);

audio.addEventListener('ended', () => {
  cancelAnimationFrame(raf);
  releaseWakeLock();

  timeEl.textContent = '60:00';
  cueEl.textContent = 'Stop';
  statusEl.textContent = '완료';
  barEl.style.width = '100%';
  startBtn.textContent = 'Start';
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && !audio.paused) {
    await requestWakeLock();
    cancelAnimationFrame(raf);
    render();
  }
});

// 기존 서비스워커가 잘못된 audio/ 경로를 캐시하려 한 문제를 피하기 위해
// 이번 버전에서는 서비스워커를 사용하지 않음.
// 이미 등록된 서비스워커가 있으면 해제해서 새 파일을 확실히 받게 함.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(reg => reg.unregister()))
    .catch(() => {});
}
</script>
</body>
</html>
